name: Release

# Push a tag like v1.1.0 (matching `version` in build.gradle.kts) to publish a GitHub release with the plugin zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches project version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.gradle.kts version v$version" >&2
            exit 1
          fi
      - name: Test and build
        run: ./gradlew test verifyCompatibilityMetadata
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/any-progress-bar-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
