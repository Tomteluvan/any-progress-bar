name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and verify packaged metadata
        run: ./gradlew test verifyCompatibilityMetadata
      - name: Verify plugin against recommended IDE versions
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: any-progress-bar
          path: build/distributions/*.zip

  # After a green push to main, publish a release when build.gradle.kts has a version that has no release yet.
  # Bump `version` to ship; pushes that keep the same version are skipped. The tag is created by
  # `gh release create` (tags pushed with GITHUB_TOKEN would not trigger release.yml, so the release is made here).
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: any-progress-bar
          path: dist
      - name: Publish release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes
