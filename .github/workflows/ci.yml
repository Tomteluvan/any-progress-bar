name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and verify packaged metadata
        run: ./gradlew test verifyCompatibilityMetadata
      - name: Verify plugin against recommended IDE versions
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: any-progress-bar
          path: build/distributions/*.zip

  # After a green push to main, publish when build.gradle.kts has a version that has no GitHub release yet:
  # first to the JetBrains Marketplace, then as a GitHub release. Bump `version` (and add a matching section to
  # CHANGELOG.md) to ship; pushes that keep the same version are skipped. The Marketplace upload comes first so a
  # failed upload leaves no release behind and the next push retries. The tag is created by `gh release create`.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JetBrains Marketplace
        if: steps.version.outputs.new == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
      - name: Create GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" build/distributions/any-progress-bar-*.zip \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
