name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test and verify packaged metadata
        run: ./gradlew test verifyCompatibilityMetadata
      - name: Verify plugin against recommended IDE versions
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: any-progress-bar
          path: build/distributions/*.zip

  # After a green push to main, publish when build.gradle.kts has a version that has no GitHub release yet:
  # first to the JetBrains Marketplace, then as a GitHub release. Both publish the plugin archive built and verified
  # by the build job (downloaded as an artifact), not a fresh rebuild. Bump `version` (and add a matching section to
  # CHANGELOG.md) to ship; pushes that keep the same version are skipped, and so are patch versions (x.y.Z with Z above 0):
  # they run the normal build and verification but are never published. The Marketplace upload comes first so a
  # failed upload leaves no release behind and the next push retries. The tag is created by `gh release create`.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: any-progress-bar
          path: dist
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          patch=$(echo "$version" | cut -d. -f3 | sed 's/[^0-9].*//')
          if [ "${patch:-0}" != "0" ]; then
            echo "Version $version is a patch bump; only minor and major versions are released."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archive="dist/any-progress-bar-$version.zip"
          test -f "$archive" || { echo "Verified archive $archive is missing."; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JetBrains Marketplace
        if: steps.version.outputs.new == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: ./gradlew publishPlugin -PpluginArchive="$ARCHIVE" -x buildPlugin
      - name: Create GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          (cd dist && sha256sum "$(basename "$ARCHIVE")" > SHA256SUMS)
          gh release create "$TAG" "$ARCHIVE" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
